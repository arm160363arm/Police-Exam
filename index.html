<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POLICEWITHARM - ระบบฝึกสอบออนไลน์</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Sarabun', sans-serif; }
  .transition-all { transition-property: all; transition-duration: 300ms; }
  
  :root { --primary-color: #800000; }
  .bg-theme { background-color: var(--primary-color); }
  .text-theme { color: var(--primary-color); }
  
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .grid-marked { position: relative; }
  .grid-marked::after { content: '🚩'; position: absolute; top: -5px; right: -5px; font-size: 8px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 transition-all">

<!-- Header -->
<header class="bg-theme text-white p-4 shadow-lg sticky top-0 z-50">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg leading-tight">POLICEWITHARM</h1>
      <p class="text-[10px] opacity-80">จำลองสอบนายสิบตำรวจ</p>
    </div>
    <div id="timer" class="bg-black/20 px-3 py-1 rounded-lg font-mono font-bold text-sm hidden">03:00:00</div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6">
  <!-- Activation Section -->
  <section id="activation-screen" class="card bg-white p-6 rounded-3xl shadow-sm border text-center max-w-sm mx-auto mt-10">
    <div class="mb-4 text-4xl">🔐</div>
    <h2 class="text-xl font-bold mb-2">เปิดใช้งานแอป</h2>
    <p class="text-xs text-slate-500 mb-4">กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบทดสอบ</p>
    <input type="text" id="input-license-key" placeholder="รหัสผ่านเข้าใช้งาน" class="w-full text-center p-3 rounded-xl border mb-4 bg-slate-50 uppercase font-bold tracking-widest focus:outline-none focus:border-red-800">
    <button onclick="verifyLicenseKey()" class="w-full py-3 bg-theme text-white font-bold rounded-xl shadow-lg hover:opacity-90 active:scale-95 transition-all">ตรวจสอบ</button>
  </section>

  <!-- Exam Content (Hidden by default) -->
  <div id="exam-container" class="hidden">
    <!-- Question Area -->
    <div class="card bg-white p-5 rounded-2xl shadow-sm border mb-4">
      <div class="flex justify-between text-xs font-bold text-slate-400 mb-4">
        <span id="q-subject">หมวดวิชา</span>
        <span id="q-number">1 / 150</span>
      </div>
      <div id="q-text" class="text-base font-semibold mb-6"></div>
      <div id="q-choices" class="space-y-2 mb-4"></div>
      
      <!-- Utility Buttons inside Question -->
      <div class="flex justify-between items-center pt-2 mb-4">
        <button onclick="clearChoice()" class="text-xs text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg font-bold transition-all">🗑️ ล้างคำตอบข้อนี้</button>
      </div>

      <div class="flex justify-between items-center pt-4 border-t">
        <button onclick="prevQ()" class="text-slate-500 font-bold px-4 py-2 hover:bg-slate-100 rounded-xl transition-all">◀ ก่อนหน้า</button>
        <button onclick="toggleMark()" id="btn-mark" class="px-3 py-2 bg-yellow-100 text-yellow-700 rounded-xl font-bold text-xs transition-all">🚩 ทำเครื่องหมาย</button>
        <button onclick="nextQ()" class="text-theme font-bold px-4 py-2 hover:bg-red-50 rounded-xl transition-all">ถัดไป ▶</button>
      </div>
    </div>
    
    <!-- Navigation Grid -->
    <div class="card bg-white p-4 rounded-2xl shadow-sm border mb-6">
      <div class="text-xs font-bold text-slate-500 mb-3 flex justify-between items-center">
        <span>ตารางข้อสอบทั้งหมด</span>
        <span id="progress-text" class="text-theme">ทำแล้ว 0/0 ข้อ</span>
      </div>
      <div id="q-grid" class="grid grid-cols-6 sm:grid-cols-10 gap-2 max-h-48 overflow-y-auto p-1 scrollbar-hide"></div>
    </div>

    <!-- Submit Section -->
    <button onclick="confirmSubmit()" class="w-full py-4 bg-emerald-600 text-white font-bold rounded-2xl shadow-lg hover:bg-emerald-700 active:scale-95 transition-all text-base">ส่งคำตอบทั้งหมด</button>
  </div>
</main>

<script>
  // ตัวอย่างข้อมูลข้อสอบและระบบจำลอง (สามารถปรับเปลี่ยนเชื่อมต่อ Google Apps Script ของท่านได้ตามต้องการ)
  const SCRIPT_URL = ""; // ใส่ URL Google Apps Script ของท่านตรงนี้
  
  let questions = [];
  let userAnswers = [];
  let markedQuestions = [];
  let currIdx = 0;
  let timerInterval;

  // ฟังก์ชันตรวจสอบรหัสผ่าน (License Key)
  async function verifyLicenseKey() {
    const key = document.getElementById('input-license-key').value.trim();
    if (!key) {
      alert('กรุณากรอกรหัสผ่าน');
      return;
    }

    // ตัวอย่างจำลองการโหลดข้อมูลข้อสอบ (ท่านสามารถเปลี่ยนเป็น fetch ไปยัง Google Apps Script ของท่าน)
    // สมมติฐานข้อมูลจำลองเพื่อความพร้อมใช้งานทันที
    loadMockExamData();
  }

  function loadMockExamData() {
    // ข้อมูลจำลองตัวอย่าง 5 ข้อ (สามารถปรับเปลี่ยนเป็นดึงจาก Server จริงได้)
    questions = [
      { subject: "ความสามารถทั่วไป", text: "ข้อใดคือผลลัพธ์ของ 5 + 5 * 5 ?", choices: ["30", "50", "25", "10"] },
      { subject: "ภาษาไทย", text: "คำในข้อใดเขียนถูกต้องทุกคำ", choices: ["อนุญาต, กะเพรา", "อนุญาติ, กะเพรา", "อนุญาต, กระเพรา", "อนุญาติ, กระเพรา"] },
      { subject: "กฎหมายที่ควรทราบ", text: "รัฐธรรมนูญแห่งราชอาณาจักรไทยฉบับปัจจุบันคือฉบับที่เท่าไหร่?", choices: ["ฉบับที่ 18", "ฉบับที่ 19", "ฉบับที่ 20", "ฉบับที่ 21"] },
      { subject: "ภาษาอังกฤษ", text: "What is the capital of Thailand?", choices: ["Singapore", "Bangkok", "Kuala Lumpur", "Jakarta"] },
      { subject: "คอมพิวเตอร์", text: "ข้อใดคือหน่วยความจำหลัก (Primary Memory)", choices: ["Harddisk", "RAM", "Flash Drive", "CD-ROM"] }
    ];

    // โหลดข้อมูลเดิมจาก LocalStorage (ถ้ามี)
    const savedAnswers = localStorage.getItem('police_user_answers');
    if (savedAnswers) {
      userAnswers = JSON.parse(savedAnswers);
    } else {
      userAnswers = new Array(questions.length).fill(null);
    }

    markedQuestions = new Array(questions.length).fill(false);

    // ซ่อนหน้าจอใส่รหัส เปิดหน้าจอทำข้อสอบ
    document.getElementById('activation-screen').classList.add('hidden');
    document.getElementById('exam-container').classList.remove('hidden');
    document.getElementById('timer').classList.remove('hidden');

    initExam();
    startTimer(3 * 3600); // ตั้งเวลา 3 ชั่วโมง
  }

  function initExam() {
    renderGrid();
    renderQ();
    updateProgress();
  }

  function renderQ() {
    const q = questions[currIdx];
    document.getElementById('q-subject').innerText = q.subject;
    document.getElementById('q-number').innerText = `${currIdx + 1} / ${questions.length}`;
    document.getElementById('q-text').innerText = `${currIdx + 1}. ${q.text}`;

    const choicesEl = document.getElementById('q-choices');
    choicesEl.innerHTML = '';

    q.choices.forEach((choice, index) => {
      const isSelected = userAnswers[currIdx] === index;
      const btn = document.createElement('button');
      btn.className = `w-full text-left p-3.5 rounded-xl border font-semibold text-sm transition-all flex items-center justify-between ${
        isSelected 
          ? 'bg-red-50 border-red-800 text-red-900 shadow-sm' 
          : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
      }`;
      
      btn.innerHTML = `<span><span class="inline-block w-6 font-bold text-theme">${String.fromCharCode(65 + index)}.</span> ${choice}</span>
                       <span class="text-xs">${isSelected ? '✅ เลือกแล้ว' : ''}</span>`;
      
      btn.onclick = () => selectChoice(index);
      choicesEl.appendChild(btn);
    });

    // อัปเดตสถานะปุ่ม Mark
    const markBtn = document.getElementById('btn-mark');
    if (markedQuestions[currIdx]) {
      markBtn.className = "px-3 py-2 bg-red-600 text-white rounded-xl font-bold text-xs transition-all";
      markBtn.innerText = "🚩 เอาเครื่องหมายออก";
    } else {
      markBtn.className = "px-3 py-2 bg-yellow-100 text-yellow-700 rounded-xl font-bold text-xs transition-all";
      markBtn.innerText = "🚩 ทำเครื่องหมาย";
    }

    updateGridHighlight();
  }

  function selectChoice(index) {
    if (userAnswers[currIdx] === index) {
      userAnswers[currIdx] = null; // กดซ้ำเพื่อยกเลิกคำตอบ
    } else {
      userAnswers[currIdx] = index;
    }
    
    // บันทึกลง LocalStorage ป้องกันข้อมูลหาย
    localStorage.setItem('police_user_answers', JSON.stringify(userAnswers));

    renderQ();
    updateProgress();
  }

  function clearChoice() {
    userAnswers[currIdx] = null;
    localStorage.setItem('police_user_answers', JSON.stringify(userAnswers));
    renderQ();
    updateProgress();
  }

  function nextQ() {
    if (currIdx < questions.length - 1) {
      currIdx++;
      renderQ();
    }
  }

  function prevQ() {
    if (currIdx > 0) {
      currIdx--;
      renderQ();
    }
  }

  function toggleMark() {
    markedQuestions[currIdx] = !markedQuestions[currIdx];
    renderQ();
    renderGrid();
  }

  function renderGrid() {
    const gridEl = document.getElementById('q-grid');
    gridEl.innerHTML = '';

    questions.forEach((_, index) => {
      const isAnswered = userAnswers[index] !== null;
      const isCurrent = currIdx === index;
      const isMarked = markedQuestions[index];

      const btn = document.createElement('button');
      let baseClass = "h-10 rounded-xl font-bold text-xs flex items-center justify-center transition-all ";
      
      if (isCurrent) {
        baseClass += "ring-2 ring-red-800 ring-offset-2 ";
      }

      if (isAnswered) {
        baseClass += "bg-emerald-600 text-white shadow-sm ";
      } else {
        baseClass += "bg-slate-100 text-slate-600 hover:bg-slate-200 ";
      }

      if (isMarked) {
        baseClass += "grid-marked ";
      }

      btn.className = baseClass;
      btn.innerText = index + 1;
      btn.onclick = () => {
        currIdx = index;
        renderQ();
      };

      gridEl.appendChild(btn);
    });
  }

  function updateGridHighlight() {
    renderGrid();
  }

  function updateProgress() {
    const answeredCount = userAnswers.filter(ans => ans !== null).length;
    document.getElementById('progress-text').innerText = `ทำแล้ว ${answeredCount}/${questions.length} ข้อ`;
  }

  function startTimer(duration) {
    let timer = duration, hours, minutes, seconds;
    const display = document.getElementById('timer');
    
    timerInterval = setInterval(() => {
      hours = parseInt(timer / 3600, 10);
      minutes = parseInt((timer % 3600) / 60, 10);
      seconds = parseInt(timer % 60, 10);

      hours = hours < 10 ? "0" + hours : hours;
      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;

      display.textContent = `${hours}:${minutes}:${seconds}`;

      if (--timer < 0) {
        clearInterval(timerInterval);
        alert('หมดเวลาทำข้อสอบ!');
        submitExam();
      }
    }, 1000);
  }

  function confirmSubmit() {
    const answeredCount = userAnswers.filter(ans => ans !== null).length;
    const confirmMsg = `คุณทำข้อสอบไปแล้ว ${answeredCount} จาก ${questions.length} ข้อ\nต้องการส่งคำตอบทั้งหมดใช่หรือไม่?`;
    if (confirm(confirmMsg)) {
      submitExam();
    }
  }

  function submitExam() {
    clearInterval(timerInterval);
    localStorage.removeItem('police_user_answers');
    alert('ส่งข้อสอบเรียบร้อยแล้ว!');
    // สามารถเพิ่มโค้ดส่งผลคะแนนไปที่ Server หรือเปลี่ยนหน้าแสดงผลสรุปคะแนนตรงนี้
  }

  // ป้องกันเผลอปิดหน้าต่างระหว่างสอบ
  window.onbeforeunload = function() {
    if (!document.getElementById('exam-container').classList.contains('hidden')) {
      return "หากคุณออกจากหน้านี้ ข้อมูลการทำข้อสอบอาจสูญหาย!";
    }
  };
</script>

</body>
</html>
