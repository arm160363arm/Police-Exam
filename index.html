<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสนามสอบจำลอง</title>
    <!-- โหลด MathJax สำหรับรองรับสูตรคณิตศาสตร์ (ถ้ามี) -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            --p: #153b68;
            --bg: #f3f5f8;
            --line: #dfe5eb;
            --muted: #697586;
            --ok: #167b3b;
            --bad: #b42318;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            background: var(--bg); 
            font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; 
            color: #18212b; 
        }

        header { 
            background: linear-gradient(135deg, #102f54, #205488); 
            color: white; 
            padding: 14px 16px; 
            position: sticky; 
            top: 0; 
            z-index: 5; 
        }

        .head { 
            max-width: 1100px; 
            margin: auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px; 
        }

        .title { font-weight: 800; font-size: 18px; }
        .sub { font-size: 12px; opacity: 0.8; }

        #timer { 
            font-size: 20px; 
            font-weight: 900; 
            background: #0004; 
            padding: 7px 11px; 
            border-radius: 9px; 
        }

        main { max-width: 1100px; margin: 18px auto; padding: 0 12px; }

        .card { 
            background: #fff; 
            border: 1px solid var(--line); 
            border-radius: 14px; 
            box-shadow: 0 4px 18px #0000000b; 
        }

        .start { text-align: center; padding: 28px; }
        .start p { color: var(--muted); line-height: 1.7; }

        button { 
            border: 0; 
            border-radius: 9px; 
            padding: 10px 14px; 
            font-weight: 800; 
            cursor: pointer; 
        }

        .primary { background: var(--p); color: white; }
        .secondary { background: #e9eef4; color: #18314c; }
        .danger { background: #b42318; color: white; }
        .mark { background: #fff3cd; color: #755500; }
        .mark.on { background: #f3cf61; }

        .layout { display: grid; grid-template-columns: 1fr 290px; gap: 16px; }

        .question { padding: 20px; }
        .subject { color: var(--p); font-weight: 900; font-size: 14px; }
        .qnum { color: var(--muted); margin: 5px 0 8px; }
        .qtext { font-size: 20px; line-height: 1.6; font-weight: 750; margin-bottom: 16px; }

        .choice { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border: 1px solid var(--line); 
            padding: 12px; 
            border-radius: 10px; 
            margin: 8px 0; 
            cursor: pointer; 
        }

        .choice.sel { background: #eef4fb; border-color: #7294b7; }
        .choice input { accent-color: var(--p); }

        .actions { 
            padding: 14px 20px; 
            border-top: 1px solid var(--line); 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
        }

        .side { padding: 15px; position: sticky; top: 76px; height: max-content; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 6px; 
            max-height: 350px; 
            overflow-y: auto; 
            margin-top: 10px; 
        }

        .num { 
            padding: 8px 0; 
            background: #fff; 
            border: 1px solid var(--line); 
            font-size: 13px; 
            border-radius: 6px; 
            cursor: pointer; 
        }

        .num.answered { background: #dbeafe; color: #1e40af; }
        .num.current { outline: 2px solid var(--p); font-weight: bold; }
        .num.marked { border-bottom: 4px solid #e2a900; }

        .result { display: none; padding: 20px; }
        .score { font-size: 36px; font-weight: 900; color: var(--p); margin-bottom: 10px; }
        .reviewitem { border-top: 1px solid var(--line); padding: 14px 0; }
        .explain { background: #f6f8fa; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 14px; }

        @media(max-width:800px) { 
            .layout { grid-template-columns: 1fr; } 
            .side { position: static; } 
        }
    </style>
</head>
<body>

    <header>
        <div class="head">
            <div>
                <div class="title">สนามสอบจำลอง</div>
                <div class="sub">แบบทดสอบออนไลน์</div>
            </div>
            <div id="timer">03:00:00</div>
        </div>
    </header>

    <main>
        <!-- หน้าแรกก่อนเริ่มทำข้อสอบ -->
        <section id="start-screen" class="card start">
            <h1>ยินดีต้อนรับสู่แบบทดสอบจำลอง</h1>
            <p>กรุณากดปุ่มด้านล่างเพื่อเริ่มทำข้อสอบ โดยจับเวลา 3 ชั่วโมง</p>
            <button class="primary" onclick="startExam()">เริ่มทำข้อสอบ</button>
        </section>

        <!-- หน้าทำข้อสอบ -->
        <section id="exam-screen" style="display:none">
            <div class="layout">
                <div class="card">
                    <div id="question" class="question"></div>
                    <div class="actions">
                        <button class="secondary" onclick="prevQ()">ข้อก่อนหน้า</button>
                        <button class="secondary" onclick="nextQ()">ข้อถัดไป</button>
                        <button id="markBtn" class="mark" onclick="toggleMark()">📌 มาร์กไว้ทบทวน</button>
                    </div>
                </div>

                <aside class="card side">
                    <b>รายการข้อสอบ</b>
                    <div id="grid" class="grid"></div>
                    <button class="danger" style="width:100%; margin-top:15px;" onclick="submitExam()">ส่งข้อสอบ</button>
                </aside>
            </div>
        </section>

        <!-- หน้าสรุปผลคะแนน -->
        <section id="result-screen" class="card result"></section>
    </main>

    <script>
        // ==========================================
        // 1. คลังข้อสอบ (ใส่/แก้ไข ข้อสอบตรงนี้)
        // ==========================================
        var Q = [
            {
                id: 1,
                subject: "1. ความสามารถทั่วไป",
                q: "25% ของจำนวนหนึ่งเท่ากับ 45 จำนวนนั้นเท่ากับเท่าใด",
                choices: ["120", "150", "180", "200"],
                answer: 2, // ข้อ ค. (0=ก, 1=ข, 2=ค, 3=ง)
                explain: "45 ÷ 0.25 = 180"
            },
            {
                id: 2,
                subject: "1. ความสามารถทั่วไป",
                q: "สินค้าราคา 800 บาท ลด 15% เหลือราคาเท่าใด",
                choices: ["650", "680", "700", "720"],
                answer: 1, // ข้อ ข.
                explain: "ส่วนลด 120 บาท จึงเหลือ 680 บาท"
            },
            {
                id: 3,
                subject: "2. ภาษาไทย",
                q: "คำในข้อใดสะกดถูกต้องตามพจนานุกรม",
                choices: ["อนุญาต", "สังเกตุ", "กระทันหัน", "ผาสุข"],
                answer: 0, // ข้อ ก.
                explain: "อนุญาต สะกดถูกไม่มี สระอิ"
            }
        ];

        // ==========================================
        // 2. ตัวแปรสำหรับจัดการสถานะระบบ
        // ==========================================
        var labels = ["ก", "ข", "ค", "ง"];
        var currIdx = 0;
        var userAnswers = new Array(Q.length).fill(null);
        var markedList = new Array(Q.length).fill(false);
        var timeLeft = 180 * 60; // เวลา 3 ชั่วโมง (วินาที)
        var timerInterval = null;

        // เริ่มทำข้อสอบ
        function startExam() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            
            renderGrid();
            renderQ();

            // เริ่มนับถอยหลัง
            timerInterval = setInterval(function() {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("หมดเวลาทำข้อสอบแล้ว!");
                    submitExam();
                }
            }, 1000);
        }

        // แสดงผลตัวนาฬิกา
        function updateTimerDisplay() {
            var h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
            var m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
            var s = String(timeLeft % 60).padStart(2, '0');
            document.getElementById('timer').innerText = h + ":" + m + ":" + s;
        }

        // วาดข้อสอบปัจจุบัน
        function renderQ() {
            var q = Q[currIdx];
            var html = '<div class="subject">' + q.subject + '</div>';
            html += '<div class="qnum">ข้อที่ ' + (currIdx + 1) + ' / ' + Q.length + '</div>';
            html += '<div class="qtext">' + q.q + '</div>';

            for (var i = 0; i < q.choices.length; i++) {
                var isChecked = userAnswers[currIdx] === i ? 'checked' : '';
                var isSel = userAnswers[currIdx] === i ? 'sel' : '';
                html += '<label class="choice ' + isSel + '" onclick="selectChoice(' + i + ')">';
                html += '<input type="radio" name="choice" ' + isChecked + '> ';
                html += '<b>' + labels[i] + '.</b> ' + q.choices[i];
                html += '</label>';
            }

            document.getElementById('question').innerHTML = html;

            // ปุ่มมาร์กทบทวน
            var markBtn = document.getElementById('markBtn');
            if (markedList[currIdx]) {
                markBtn.classList.add('on');
            } else {
                markBtn.classList.remove('on');
            }

            renderGrid();
            if (window.MathJax) MathJax.typeset();
        }

        // เลือกคำตอบ
        function selectChoice(idx) {
            userAnswers[currIdx] = idx;
            renderQ();
        }

        // เลื่อนข้อสอบ
        function prevQ() {
            if (currIdx > 0) { currIdx--; renderQ(); }
        }
        function nextQ() {
            if (currIdx < Q.length - 1) { currIdx++; renderQ(); }
        }

        // มาร์กทบทวน
        function toggleMark() {
            markedList[currIdx] = !markedList[currIdx];
            renderQ();
        }

        // แสดงตารางเลือกข้อด้านข้าง
        function renderGrid() {
            var html = '';
            for (var i = 0; i < Q.length; i++) {
                var cls = 'num';
                if (i === currIdx) cls += ' current';
                if (userAnswers[i] !== null) cls += ' answered';
                if (markedList[i]) cls += ' marked';

                html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i + 1) + '</button>';
            }
            document.getElementById('grid').innerHTML = html;
        }

        function jumpTo(idx) {
            currIdx = idx;
            renderQ();
        }

        // ส่งข้อสอบและคำนวณคะแนน
        function submitExam() {
            if (confirm("คุณต้องการส่งข้อสอบใช่หรือไม่?")) {
                clearInterval(timerInterval);
                document.getElementById('exam-screen').style.display = 'none';
                
                var score = 0;
                var reviewHtml = '<h2>ผลการสอบของคุณ</h2>';

                for (var i = 0; i < Q.length; i++) {
                    var isCorrect = userAnswers[i] === Q[i].answer;
                    if (isCorrect) score++;

                    reviewHtml += '<div class="reviewitem">';
                    reviewHtml += '<div><b>ข้อที่ ' + (i + 1) + ':</b> ' + Q[i].q + '</div>';
                    reviewHtml += '<div>ตอบ: ' + (userAnswers[i] !== null ? labels[userAnswers[i]] : 'ไม่ได้ตอบ') + '</div>';
                    reviewHtml += '<div style="color:' + (isCorrect ? 'var(--ok)' : 'var(--bad)') + ';">' + (isCorrect ? 'ถูกต้อง' : 'ผิด (เฉลย: ' + labels[Q[i].answer] + ')') + '</div>';
                    reviewHtml += '<div class="explain"><b>คำอธิบาย:</b> ' + Q[i].explain + '</div>';
                    reviewHtml += '</div>';
                }

                var resCard = document.getElementById('result-screen');
                resCard.innerHTML = '<div class="score">คะแนนที่ได้: ' + score + ' / ' + Q.length + '</div>' + reviewHtml;
                resCard.style.display = 'block';
            }
        }
    </script>
</body>
</html>
